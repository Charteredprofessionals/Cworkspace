name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install system dependencies
        run: |
          choco install -y microsoft-visual-cpp-build-tools --version 14.40.33810 --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows10SDK.19041"
        shell: pwsh

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2.5

      - name: Build main binary (release-lto)
        run: cargo build --profile release-lto
        working-directory: .

      - name: Install GUI dependencies
        run: npm ci
        working-directory: gui

      - name: Build GUI frontend
        run: npm run build
        working-directory: gui

      - name: Build Tauri application
        run: cargo tauri build --target x86_64-pc-windows-msvc
        working-directory: gui/src-tauri
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3

      - name: Find installer artifacts
        id: artifacts
        run: |
          $installers = Get-ChildItem gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle -Filter "*.msi","*.exe" -Recurse -ErrorAction SilentlyContinue
          if (-not $installers) {
            Write-Error "No installer artifacts found"
            exit 1
          }
          $paths = $installers | ForEach-Object { $_.FullName }
          echo "paths=$($paths -join ';')" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: ${{ steps.artifacts.outputs.paths }}
          retention-days: 30

      - name: Upload main binary
        uses: actions/upload-artifact@v4
        with:
          name: jcode-binary
          path: target/release-lto/jcode.exe
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: installers

      - name: Download main binary
        uses: actions/download-artifact@v4
        with:
          name: jcode-binary
          path: bin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/*
            bin/jcode.exe
          generate_release_notes: true
