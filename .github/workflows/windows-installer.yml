name: Windows Installer

on:
  workflow_dispatch:
  # Dispatch manually after a release tag is published. The former
  # `push: tags: v*` trigger was removed (R-6): it raced the release
  # pipeline and could publish a partial installer for the same tag.
  # (Do not re-add a `v*` tag push trigger; release.yml owns tag events.)

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml sets a POSIX rustc wrapper that cannot execute on
  # Windows; the config prescribes clearing it here (Windows runner image
  # ships VS 2022 MSVC + Windows SDK, so no choco build-tools install is
  # needed either — the pinned community package was removed upstream and
  # failed every run).
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install Tauri CLI
        # Idempotent: the cargo cache includes ~/.cargo/bin, so after any
        # successful run `cargo install` would abort with "binary
        # cargo-tauri.exe already exists in destination" (run 11). Install
        # only when the binary is absent — also saves the ~10 min compile
        # on warm runs.
        run: |
          if (Test-Path "$env:USERPROFILE\.cargo\bin\cargo-tauri.exe") {
            Write-Host "tauri-cli already cached: $(cargo tauri --version)"
          } else {
            cargo install tauri-cli --version ^2.5
          }

      - name: Build main binary (release-lto)
        run: cargo build --profile release-lto
        working-directory: .

      - name: Install GUI dependencies
        run: npm ci
        working-directory: gui

      - name: Build GUI frontend
        run: npm run build
        working-directory: gui

      - name: Build Tauri application
        run: cargo tauri build --target x86_64-pc-windows-msvc
        working-directory: gui/src-tauri
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3

      - name: Find installer artifacts
        run: |
          $installers = Get-ChildItem gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle -Recurse -Include *.msi,*.exe -ErrorAction SilentlyContinue
          if (-not $installers) {
            Write-Error "No installer artifacts found"
            exit 1
          }
          $installers | ForEach-Object { Write-Host "installer: $($_.FullName)" }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          # upload-artifact@v4 does NOT split a single-line path on ';': an
          # "a;b" list is treated as one literal pattern and matches nothing
          # (run 10 warned "No files were found" and uploaded nothing).
          # Multi-line globs are the supported form; fail loudly instead of
          # silently skipping the upload.
          path: |
            gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload main binary
        uses: actions/upload-artifact@v4
        with:
          name: jcode-binary
          path: target/release-lto/jcode.exe
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: installers

      - name: Download main binary
        uses: actions/download-artifact@v4
        with:
          name: jcode-binary
          path: bin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/**/*
            bin/jcode.exe
          generate_release_notes: true
