[package]
name = "jcode-cowork-gui"
version = "0.1.0"
description = "Cworkspace desktop interface"
authors = ["Cworkspace"]
edition = "2021"

[lib]
name = "jcode_cowork_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", default-features = false, features = ["rt"] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Kill-on-close job object ties the daemon's lifetime to the GUI process
# (see attach_kill_on_close_job in lib.rs); an orphaned daemon would keep
# the install directory's files in use and block uninstallers and upgrades.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[workspace]
