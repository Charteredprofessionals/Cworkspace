[package]
name = "jcode-cowork-gui"
version = "0.1.0"
description = "jcode Cowork desktop interface"
authors = ["jcode"]
edition = "2021"

[lib]
name = "jcode_cowork_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[workspace]
